name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Production
    runs-on: ubuntu-latest
    environment: firebase-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify functions
        working-directory: functions
        run: npm run ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firebase
        run: npx firebase-tools@latest deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --only functions,hosting
