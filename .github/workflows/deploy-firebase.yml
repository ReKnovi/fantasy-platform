name: Deploy Firebase

on:
  # Temporarily manual-only until Blaze is enabled and these GitHub values exist:
  # - vars.FIREBASE_PROJECT_ID
  # - secrets.FIREBASE_SERVICE_ACCOUNT_JSON
  #
  # Restore this block when production Firebase deploys are ready:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Production
    runs-on: ubuntu-latest
    environment: firebase-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run quality checks
        run: npm run ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firebase
        # Pinned deliberately — an unpinned @latest here means a new firebase-tools
        # release can change deploy behavior with zero warning on an ordinary push
        # to main. Bump this version intentionally when you want the update.
        run:
          npx firebase-tools@15.25.1 deploy --project "${{
          vars.FIREBASE_PROJECT_ID }}" --only functions,hosting
