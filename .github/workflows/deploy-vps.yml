name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to deploy
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/fantasy-functions

jobs:
  build:
    name: Build And Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: functions
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs: build
    environment: vps-production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu
            docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
            docker pull "${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
            docker stop fantasy-functions || true
            docker rm fantasy-functions || true
            docker run -d \
              --name fantasy-functions \
              --restart unless-stopped \
              -p 8080:8080 \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -e DATABASE_URL='${{ secrets.VPS_DATABASE_URL }}' \
              "${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
