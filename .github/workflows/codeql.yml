name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly scan catches vulnerabilities in dependencies even without code changes.
    - cron: "31 2 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # Skip Dependabot PRs — CodeQL analyzes code patterns, not dependency
    # versions. The weekly schedule still catches new advisories. Saves ~3-5
    # minutes per Dependabot PR.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
