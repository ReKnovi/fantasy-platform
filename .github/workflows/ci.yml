name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent double runs: a PR merge triggers both pull_request (close) and push.
# This concurrency group cancels the redundant run.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Repository Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Node setup (caches both root and functions lockfiles) ──
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      # ── Install ──
      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # ── Lint ──
      - name: Lint
        run: npm run lint

      # ── Format ──
      - name: Check formatting
        run: npm run format:check

      # ── Test ──
      - name: Test
        run: npm run test

      # ── Build ──
      - name: Build Firebase Functions
        run: npm run build

      # ── Validate ──
      - name: Validate repository structure
        run: npm run validate

      # ── Security ──
      - name: Scan for secrets
        if: github.actor != 'dependabot[bot]'
        run: npm run validate:secrets

      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: |
          npm audit --audit-level=high || true
          cd functions && npm audit --audit-level=high || true

      # ── Docker (VPS build check) ──
      # Skip on Dependabot PRs — dependency updates don't affect the Dockerfile
      # and this step takes ~2-3 minutes.
      - name: Build VPS container image
        if: github.actor != 'dependabot[bot]'
        run: docker build -t fantasy-functions:${{ github.sha }} functions
