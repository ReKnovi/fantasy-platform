<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fantasy Platform</title>
    <script defer src="/__/firebase/12.16.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.16.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f5f7fb;
        color: #172033;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 48px auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        color: #4c5b70;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #1663ff;
        color: #fff;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }

      button.secondary {
        background: #e8edf7;
        color: #172033;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .panel {
        background: #fff;
        border: 1px solid #dce3ee;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .status {
        display: grid;
        gap: 8px;
      }

      code,
      pre {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      pre {
        min-height: 180px;
        overflow: auto;
        background: #101725;
        color: #dce9ff;
        border-radius: 8px;
        padding: 16px;
        white-space: pre-wrap;
      }

      .muted {
        color: #6b778c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Fantasy Platform</h1>
          <p>Firebase Auth with Google sign-in and protected API access.</p>
        </div>
      </header>

      <section class="panel status">
        <strong id="auth-status">Checking auth state...</strong>
        <span id="user-detail" class="muted"></span>
        <div class="actions">
          <button id="sign-in" type="button">Sign in with Google</button>
          <button id="sign-out" class="secondary" type="button" disabled>
            Sign out
          </button>
          <button id="load-players" type="button" disabled>
            Load protected players
          </button>
        </div>
      </section>

      <section class="panel">
        <strong>API response</strong>
        <pre id="output">Sign in to request /players with a Firebase ID token.</pre>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const authStatus = document.querySelector("#auth-status");
        const userDetail = document.querySelector("#user-detail");
        const signInButton = document.querySelector("#sign-in");
        const signOutButton = document.querySelector("#sign-out");
        const loadPlayersButton = document.querySelector("#load-players");
        const output = document.querySelector("#output");

        const app = firebase.app();
        const auth = firebase.auth();
        const projectId = app.options.projectId || "premier-league-af352";
        const localHosts = ["localhost", "127.0.0.1"];
        const isLocal = localHosts.includes(window.location.hostname);
        const apiBaseUrl = isLocal ?
          `http://${window.location.hostname}:5001/${projectId}/us-central1/api` :
          `https://us-central1-${projectId}.cloudfunctions.net/api`;

        if (isLocal) {
          auth.useEmulator("http://127.0.0.1:9099");
        }

        const writeOutput = (value) => {
          output.textContent = typeof value === "string" ?
            value :
            JSON.stringify(value, null, 2);
        };

        auth.onAuthStateChanged((user) => {
          const signedIn = Boolean(user);
          signInButton.disabled = signedIn;
          signOutButton.disabled = !signedIn;
          loadPlayersButton.disabled = !signedIn;
          authStatus.textContent = signedIn ?
            "Signed in" :
            "Signed out";
          userDetail.textContent = signedIn ?
            `${user.displayName || "Firebase user"} • ${user.email || user.uid}` :
            "";
        });

        signInButton.addEventListener("click", async () => {
          try {
            const provider = new firebase.auth.GoogleAuthProvider();
            await auth.signInWithPopup(provider);
          } catch (err) {
            console.error(err);
            writeOutput(err.message || "Google sign-in failed");
          }
        });

        signOutButton.addEventListener("click", async () => {
          await auth.signOut();
          writeOutput("Signed out.");
        });

        loadPlayersButton.addEventListener("click", async () => {
          const user = auth.currentUser;
          if (!user) {
            writeOutput("Sign in first.");
            return;
          }

          try {
            const token = await user.getIdToken();
            const response = await fetch(`${apiBaseUrl}/players`, {
              headers: {
                "Authorization": `Bearer ${token}`,
              },
            });
            const data = await response.json();
            writeOutput({
              status: response.status,
              data,
            });
          } catch (err) {
            console.error(err);
            writeOutput(err.message || "Failed to load players");
          }
        });
      });
    </script>
  </body>
</html>
